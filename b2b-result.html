<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смета · РПКМ Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">
            <div class="logo-mark">Р</div>
            <span>РПКМ <span style="color:var(--terra);font-size:13px;font-weight:600;">PRO</span></span>
        </a>
        <nav class="nav">
            <a href="b2b-cabinet.html">← В кабинет</a>
            <a href="b2b-quiz.html" class="btn btn-ghost">+ Новый расчёт</a>
        </nav>
    </div>
</header>

<main class="quiz-page b2b">
    <div class="quiz-wrap">
        <div id="result-container"></div>
    </div>
</main>

<script src="js/auth.js"></script>
<script src="js/calculator.js"></script>
<script src="js/pdf-export.js"></script>
<script>
    Auth.requireAuth();
    const params = new URLSearchParams(location.search);
    const calcId = params.get('id');
    const calc = Calcs.getById(calcId);
    const container = document.getElementById('result-container');

    if (!calc) {
        container.innerHTML = `
            <div class="quiz-card">
                <div class="success-screen">
                    <h2>Расчёт не найден</h2>
                    <p>Возможно, был удалён или открыт по неверной ссылке.</p>
                    <a href="b2b-cabinet.html" class="btn btn-secondary">Вернуться в кабинет</a>
                </div>
            </div>
        `;
    } else {
        const r = calc.result;
        const modRows = Object.entries(r.modifiers).map(([k, v]) =>
            `<div><div class="meta-item-label">${k}</div><div class="meta-item-value">${v}</div></div>`
        ).join('');

        const breakdownItems = Object.values(r.breakdown).map(b => `
            <div class="breakdown-row">
                <div>
                    <div class="breakdown-label">${b.label}</div>
                </div>
                <div>
                    <div class="breakdown-amount">${formatRub(b.low)} – ${formatRub(b.high)}</div>
                </div>
            </div>
        `).join('');

        container.innerHTML = `
            <div class="quiz-card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
                    <div>
                        <div style="font-size:13px;color:var(--gray-500);margin-bottom:4px;">Проект</div>
                        <h2 style="margin-bottom:0;">${calc.projectName}</h2>
                        <div style="font-size:13px;color:var(--gray-500);margin-top:6px;">Расчёт от ${new Date(calc.timestamp).toLocaleString('ru-RU')}</div>
                    </div>
                    <button id="pdf-btn" class="btn btn-secondary">📄 Скачать PDF</button>
                </div>

                <div class="result-hero">
                    <div class="result-label">Ориентировочная стоимость</div>
                    <div class="result-price">
                        <span class="accent" style="color:var(--navy);">${formatRub(r.totalLow)}</span> –
                        <span class="accent" style="color:var(--navy);">${formatRub(r.totalHigh)}</span>
                    </div>
                    <div class="result-disclaimer">
                        Расчёт по средней стоимости 1 м² с учётом коэффициентов сложности.
                        Точная итоговая цена формируется после разработки проектной документации
                        и составления спецификаций материалов.
                    </div>
                </div>

                <h3 style="margin-bottom:12px;">Разбивка по статьям</h3>
                <div class="result-breakdown">${breakdownItems}</div>

                <div class="result-meta" style="margin-top:24px;">
                    <div><div class="meta-item-label">Площадь</div><div class="meta-item-value">${r.area} м²</div></div>
                    <div><div class="meta-item-label">Категория</div><div class="meta-item-value">${r.tierLabel}</div></div>
                    <div><div class="meta-item-label">Цена за м²</div><div class="meta-item-value">${r.lowPerM2.toLocaleString('ru-RU')} – ${r.highPerM2.toLocaleString('ru-RU')} ₽</div></div>
                    <div><div class="meta-item-label">Сроки</div><div class="meta-item-value">${formatDays(r.days)}</div></div>
                </div>

                <h3 style="margin: 28px 0 12px;">Параметры расчёта</h3>
                <div class="result-meta">${modRows}</div>

                <div class="alert alert-warn" style="margin-top:24px;">
                    <strong>Методология:</strong> бот даёт ориентировочную сумму на основании
                    средней стоимости 1 м² по категориям и факторов сложности. Точная итоговая
                    стоимость формируется после разработки проектной документации и составления
                    спецификаций материалов — это работа сметчика.
                </div>

                <div class="result-cta">
                    <h3>Обсудить проект с РПКМ</h3>
                    <p>Личная встреча с руководителем для обсуждения сотрудничества по этому проекту.</p>
                    <button class="btn btn-secondary" onclick="alert('В демо-проекте — только показ. В реальной версии: запрос отправляется в CRM, менеджер связывается с вами в течение рабочего дня.')">Запросить встречу</button>
                </div>
            </div>
        `;

        document.getElementById('pdf-btn').addEventListener('click', () => {
            generatePDF(calc, Auth.current());
        });
    }
</script>

</body>
</html>
