<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет профи · РПКМ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="logo">
            <div class="logo-mark">Р</div>
            <span>РПКМ</span>
        </a>
        <nav class="nav">
            <a href="index.html">На главную</a>
        </nav>
    </div>
</header>

<main class="login-page">
    <div class="login-card">
        <h2 id="form-title">Вход для профессионалов</h2>
        <p class="lead" id="form-lead">Дизайнеры, технические заказчики, инженеры пресейла</p>

        <div class="tab-switch">
            <button id="tab-login" class="active" type="button">Вход</button>
            <button id="tab-register" type="button">Регистрация</button>
        </div>

        <form id="login-form">
            <div class="form-field">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="vy@example.com" required>
            </div>
            <div class="form-field">
                <label>Пароль</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn btn-secondary" style="width:100%;">Войти</button>
            <div class="form-error" id="login-err"></div>
        </form>

        <form id="register-form" style="display:none;">
            <div class="form-field">
                <label>ФИО</label>
                <input type="text" id="reg-name" placeholder="Иван Петров" required>
            </div>
            <div class="form-field">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="vy@example.com" required>
            </div>
            <div class="form-field">
                <label>Организация</label>
                <input type="text" id="reg-org" placeholder="Студия / название бюро / самозанятый" required>
            </div>
            <div class="form-field">
                <label>Специализация</label>
                <select id="reg-role" required>
                    <option value="">— выберите —</option>
                    <option value="designer">Дизайнер интерьеров</option>
                    <option value="architect">Архитектор</option>
                    <option value="tech_customer">Технический заказчик</option>
                    <option value="presale_engineer">Инженер пресейла</option>
                    <option value="other">Другое</option>
                </select>
            </div>
            <div class="form-field">
                <label>Портфолио / профиль (опционально)</label>
                <input type="text" id="reg-portfolio" placeholder="ссылка на сайт, Behance, Houzz">
            </div>
            <div class="form-field">
                <label>Пароль</label>
                <input type="password" id="reg-password" minlength="6" required>
            </div>
            <label class="checkbox-row">
                <input type="checkbox" id="reg-nda" required>
                <span>Согласен с NDA: данные расчётов и проектов хранятся конфиденциально, не используются в маркетинге без письменного согласия.</span>
            </label>
            <button type="submit" class="btn btn-secondary" style="width:100%; margin-top: 8px;">Зарегистрироваться</button>
            <div class="form-error" id="reg-err"></div>
            <div class="form-success" id="reg-success"></div>
        </form>

        <div class="alert alert-info" style="margin-top: 20px;">
            <strong>Это демо-проект.</strong> В реальной версии регистрация подтверждается модерацией РПКМ в течение 1 рабочего дня. Здесь — автоматически через 1.5 секунды.
        </div>
    </div>
</main>

<script src="js/auth.js"></script>
<script>
    const $ = (id) => document.getElementById(id);

    // If already logged in, go straight to cabinet
    if (Auth.current()) location.href = 'b2b-cabinet.html';

    function switchTab(which) {
        $('tab-login').classList.toggle('active', which === 'login');
        $('tab-register').classList.toggle('active', which === 'register');
        $('login-form').style.display = which === 'login' ? '' : 'none';
        $('register-form').style.display = which === 'register' ? '' : 'none';
        $('form-title').textContent = which === 'login' ? 'Вход для профессионалов' : 'Регистрация профессионала';
        $('form-lead').textContent = which === 'login'
            ? 'Дизайнеры, технические заказчики, инженеры пресейла'
            : 'Доступ выдаётся после модерации (в демо — автоматически)';
    }

    $('tab-login').addEventListener('click', () => switchTab('login'));
    $('tab-register').addEventListener('click', () => switchTab('register'));

    $('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const err = $('login-err');
        err.textContent = '';
        try {
            Auth.login($('login-email').value, $('login-password').value);
            location.href = 'b2b-cabinet.html';
        } catch (ex) {
            err.textContent = ex.message;
        }
    });

    $('register-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const err = $('reg-err');
        const ok = $('reg-success');
        err.textContent = ''; ok.textContent = '';
        try {
            const user = Auth.register({
                email: $('reg-email').value,
                name: $('reg-name').value,
                organization: $('reg-org').value,
                role: $('reg-role').value,
                portfolio: $('reg-portfolio').value,
                password: $('reg-password').value,
            });
            ok.textContent = '✓ Заявка принята. Подтверждение через 1.5 сек, затем вход…';
            setTimeout(() => {
                Auth.login(user.email, user.password);
                location.href = 'b2b-cabinet.html';
            }, 2000);
        } catch (ex) {
            err.textContent = ex.message;
        }
    });
</script>

</body>
</html>
